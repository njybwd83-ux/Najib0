<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام محاسبة ميني ماركت</title>
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --text:#1b2430; --muted:#6b7684; --border:#e2e6ea;
  --brand:#0C447C; --brand2:#0a3763; --gold:#BA7517; --ok:#1d8a4a; --warn:#b8860b; --bad:#c0392b;
  --input-bg:#ffffff; color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#1a212b; --text:#e7ebf0; --muted:#8b96a3; --border:#2a333d;
    --brand:#3f8fd6; --brand2:#2f6ba8; --gold:#d79a3b; --ok:#3fb876; --warn:#e0b84a; --bad:#e06464;
    --input-bg:#222a35; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a212b; --text:#e7ebf0; --muted:#8b96a3; --border:#2a333d;
  --brand:#3f8fd6; --brand2:#2f6ba8; --gold:#d79a3b; --ok:#3fb876; --warn:#e0b84a; --bad:#e06464;
  --input-bg:#222a35; color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--brand2);}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--brand2);color:#fff;
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
header h1{font-size:15px;margin:0;font-weight:700;}
header .store{font-size:11px;opacity:.85;}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);
  padding:6px 8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:39;}
nav button{flex:0 0 auto;background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:8px;
  font-size:12.5px;cursor:pointer;font-weight:600;white-space:nowrap;}
nav button.active{background:var(--brand);color:#fff;}
main{padding:12px;max-width:1100px;margin:0 auto;padding-bottom:40px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.card h2{font-size:14px;margin:0 0 10px;color:var(--brand);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
.stat .v{font-size:16px;font-weight:800;}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:2px;}
.ok{color:var(--ok);} .bad{color:var(--bad);} .warn{color:var(--warn);}
form.inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:10px;}
input,select{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:7px;background:var(--input-bg);
  color:var(--text);font-size:12.5px;}
label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px;}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12.5px;
  font-weight:700;cursor:pointer;}
.btn.sec{background:var(--border);color:var(--text);}
.btn.del{background:var(--bad);color:#fff;padding:4px 8px;font-size:11px;}
.btn.ed{background:var(--gold);color:#fff;padding:4px 8px;font-size:11px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--muted);font-weight:700;font-size:10.5px;}
.tblwrap{overflow-x:auto;}
.tag{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.tag.okbg{background:#1d8a4a22;color:var(--ok);} .tag.warnbg{background:#b8860b22;color:var(--warn);}
.tag.badbg{background:#c0392b22;color:var(--bad);}
.hint{font-size:11px;color:var(--muted);margin-top:4px;}
.row{display:flex;gap:6px;}
.actions{display:flex;gap:4px;justify-content:center;}
::-webkit-scrollbar{height:6px;width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.postiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px;}
.postile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;}
.postile:active{background:var(--brand);color:#fff;}
.postile:disabled{opacity:.35;}
.postile .ptn{font-size:11.5px;font-weight:700;min-height:28px;line-height:1.3;}
.postile .ptp{font-size:13px;font-weight:800;color:var(--brand);margin-top:3px;}
.postile:active .ptp{color:#fff;}
.postile .pts{font-size:9.5px;color:var(--muted);margin-top:1px;}
.scanModal{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;}
.scanBox{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;}
#scanVideo{width:100%;max-width:480px;border-radius:10px;background:#111;}
.printonly{display:none;}
@media print{
  body *{visibility:hidden;}
  #printInvoice,#printInvoice *{visibility:visible;}
  #printInvoice{display:block !important;position:absolute;top:0;left:0;width:100%;padding:16px;color:#000;background:#fff;}
}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">نظام محاسبة ميني ماركت</h1>
  <span class="store" id="hStore"></span>
  <span class="row" style="align-items:center;gap:8px">
    <span class="store" id="logoutName"></span>
    <button class="btn sec" id="logoutBtn" style="display:none;padding:5px 10px;font-size:11px" onclick="CURRENT_USER=null;try{localStorage.removeItem('mm_session');}catch(e){}render();">خروج</button>
  </span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="printInvoice" class="printonly"></div>

<script>
const KEY='mm_accounting_db_v1';
const TABS=[
 ['dash','لوحة التحكم'],['pos','نقطة البيع'],['sales','المبيعات'],['purch','المشتريات'],['prod','المنتجات'],
 ['wh','المخازن'],['vouchers','السندات'],['assembly','تركيب الأصناف'],
 ['exp','المصروفات'],['cust','العملاء'],['sup','الموردون'],['settings','الإعدادات']
];
const CASHIER_TABS=['pos','dash'];
const PAYS=['نقد','بطاقة','آجل'];
const ECATS=['إيجار','رواتب','كهرباء ومياه','نقل وتوصيل','صيانة','تسويق','أخرى'];

function todayStr(){return new Date().toISOString().slice(0,10);}
function fmt(n){return (Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}

function defaultDB(){
  return {
    store:{name:'ميني ماركت الحي الليبي', currency:'ريال'},
    products:[], sales:[], purchases:[], expenses:[],
    customers:[], suppliers:[], custPay:[], supPay:[], stockAdj:[],
    warehouses:[{id:'wh-main',name:'المخزن الرئيسي'}],
    vouchers:[], assemblies:[],
    users:[{id:'u1',name:'المدير',role:'مدير',pin:'1234'}]
  };
}
let DB;
try{ DB = JSON.parse(localStorage.getItem(KEY)) || defaultDB(); }catch(e){ DB = defaultDB(); }
if(!DB.custPay) DB.custPay=[]; if(!DB.supPay) DB.supPay=[]; if(!DB.stockAdj) DB.stockAdj=[];
if(!DB.warehouses||!DB.warehouses.length) DB.warehouses=[{id:'wh-main',name:'المخزن الرئيسي'}];
if(!DB.vouchers) DB.vouchers=[]; if(!DB.assemblies) DB.assemblies=[];
if(!DB.users||!DB.users.length) DB.users=[{id:'u1',name:'المدير',role:'مدير',pin:'1234'}];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ console.error(e); } }

let TAB = 'dash';
let EDIT = {prod:null, sales:null, purch:null, exp:null, cust:null, sup:null, user:null};
let CURRENT_USER=null;
try{ const sid=localStorage.getItem('mm_session'); if(sid) CURRENT_USER=DB.users.find(u=>u.id===sid)||null; }catch(e){}

// ---------- derived calculations ----------
function prodStats(p){
  const purchQty = DB.purchases.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.qty,0);
  const purchCost = DB.purchases.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.qty*x.unitCost,0);
  const soldQty = DB.sales.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.qty,0);
  const adjQty = DB.stockAdj.filter(x=>x.pid===p.id).reduce((a,x)=>a+(+x.qty||0),0);
  const stock = (+p.open||0) + purchQty - soldQty + adjQty;
  const avgCost = ((+p.open||0)+purchQty)>0 ? (((+p.open||0)*(+p.cost||0))+purchCost) / ((+p.open||0)+purchQty) : (+p.cost||0);
  const stockValue = stock*avgCost;
  let status='متوفر', cls='okbg';
  if(stock<0){status='خطأ: سالب'; cls='badbg';}
  else if(stock===0){status='نفد'; cls='badbg';}
  else if(stock<=(+p.min||0)){status='اطلب'; cls='warnbg';}
  return {purchQty,soldQty,stock,avgCost,stockValue,status,cls};
}
function salesLine(s){
  const p = DB.products.find(x=>x.id===s.pid);
  const avg = p ? prodStats(p).avgCost : 0;
  const total = s.qty*s.price - (+s.disc||0);
  const cost = s.qty*avg;
  return {total, cost, profit: total-cost, pname: p?p.name:'—'};
}
function custBalance(name){
  const credit = DB.sales.filter(s=>s.pay==='آجل' && s.customer===name).reduce((a,s)=>a+salesLine(s).total,0);
  const paid = DB.custPay.filter(c=>c.customer===name).reduce((a,c)=>a+(+c.amount||0),0);
  return {credit,paid,balance:credit-paid};
}
function supBalance(name){
  const total = DB.purchases.filter(x=>x.supplier===name).reduce((a,x)=>a+x.qty*x.unitCost,0);
  const paidAtInvoice = DB.purchases.filter(x=>x.supplier===name).reduce((a,x)=>a+(+x.paid||0),0);
  const paidLater = DB.supPay.filter(x=>x.supplier===name).reduce((a,x)=>a+(+x.amount||0),0);
  return {total, paid:paidAtInvoice+paidLater, balance: total-paidAtInvoice-paidLater};
}
function inRange(dateStr,from,to){ return (!from||dateStr>=from) && (!to||dateStr<=to); }
function printInvoice(inv){
  const lines = DB.sales.filter(s=>s.inv===inv);
  if(!lines.length) return;
  const first=lines[0];
  const rows = lines.map(s=>{ const l=salesLine(s); return `<tr><td style="text-align:right">${l.pname}</td><td>${s.qty}</td><td>${fmt(s.price)}</td><td>${fmt(l.total)}</td></tr>`; }).join('');
  const grand = lines.reduce((a,s)=>a+salesLine(s).total,0);
  document.getElementById('printInvoice').innerHTML = `
    <h2 style="margin:0">${DB.store.name}</h2>
    <div>فاتورة رقم: ${inv} — ${first.date}</div>
    <table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:13px">
      <thead><tr><th style="text-align:right;border-bottom:1px solid #999">الصنف</th><th style="border-bottom:1px solid #999">كمية</th><th style="border-bottom:1px solid #999">سعر</th><th style="border-bottom:1px solid #999">إجمالي</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:10px;font-weight:bold;font-size:15px">الإجمالي: ${fmt(grand)} ${DB.store.currency}</div>
    <div style="margin-top:4px">طريقة الدفع: ${first.pay}${first.customer?' — العميل: '+first.customer:''}</div>
    <div style="margin-top:16px;text-align:center">شكراً لتعاملكم معنا</div>`;
  setTimeout(()=>window.print(),50);
}
let SCAN_STREAM=null;
async function startScan(){
  const modal=document.getElementById('scanModal'); if(modal) modal.style.display='flex';
  const hint=document.getElementById('scanHint');
  if(!('BarcodeDetector' in window)){
    if(hint) hint.textContent='متصفحك لا يدعم مسح الباركود المدمج. أدخل الاسم أو الكود في مربع البحث يدوياً.';
    return;
  }
  try{
    SCAN_STREAM = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('scanVideo'); video.srcObject=SCAN_STREAM;
    const detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});
    const loop=async()=>{
      if(!SCAN_STREAM) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          const val=codes[0].rawValue;
          const p=DB.products.find(x=>x.barcode===val || x.code===val);
          if(p){ posAddLine(p.id,1); stopScan(); render(); return; }
          else if(hint){ hint.textContent='لم يتم العثور على منتج بهذا الباركود: '+val; }
        }
      }catch(e){}
      if(SCAN_STREAM) requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    if(hint) hint.textContent='تعذر الوصول إلى الكاميرا. تأكد من منح إذن الكاميرا للمتصفح.';
  }
}
function stopScan(){
  const modal=document.getElementById('scanModal'); if(modal) modal.style.display='none';
  if(SCAN_STREAM){ SCAN_STREAM.getTracks().forEach(t=>t.stop()); SCAN_STREAM=null; }
}
function cashBalance(){
  const cashSales = DB.sales.filter(s=>s.pay==='نقد').reduce((a,s)=>a+salesLine(s).total,0);
  const cashPurchPaid = DB.purchases.reduce((a,x)=>a+(+x.paid||0),0) + DB.supPay.reduce((a,x)=>a+(+x.amount||0),0);
  const expTotal = DB.expenses.reduce((a,e)=>a+(+e.amount||0),0);
  const custPayTotal = DB.custPay.reduce((a,c)=>a+(+c.amount||0),0);
  const vIn = DB.vouchers.filter(v=>v.type==='قبض').reduce((a,v)=>a+(+v.amount||0),0);
  const vOut = DB.vouchers.filter(v=>v.type==='صرف').reduce((a,v)=>a+(+v.amount||0),0);
  return cashSales+custPayTotal+vIn-cashPurchPaid-expTotal-vOut;
}
function whStock(pid, whId){
  const mainId = DB.warehouses[0].id;
  const p = DB.products.find(x=>x.id===pid);
  let base = 0;
  if(whId===mainId && p){
    const purchQty = DB.purchases.filter(x=>x.pid===pid).reduce((a,x)=>a+x.qty,0);
    const soldQty = DB.sales.filter(x=>x.pid===pid).reduce((a,x)=>a+x.qty,0);
    base = (+p.open||0) + purchQty - soldQty;
  }
  const adj = DB.stockAdj.filter(x=>x.pid===pid && (x.wh||mainId)===whId).reduce((a,x)=>a+(+x.qty||0),0);
  return base+adj;
}

// ---------- render shell ----------
function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  const visible = (CURRENT_USER&&CURRENT_USER.role==='كاشير') ? TABS.filter(([id])=>CASHIER_TABS.includes(id)) : TABS;
  visible.forEach(([id,label])=>{
    const b=document.createElement('button');
    b.textContent=label; b.className= id===TAB?'active':'';
    b.onclick=()=>{TAB=id; render();};
    nav.appendChild(b);
  });
}
document.getElementById('hStore').textContent = DB.store.name + ' • ' + DB.store.currency;

function render(){
  if(!CURRENT_USER){ renderLogin(); return; }
  if(CURRENT_USER.role==='كاشير' && !CASHIER_TABS.includes(TAB)) TAB='pos';
  renderNav();
  document.getElementById('hStore').textContent = DB.store.name + ' • ' + DB.store.currency;
  document.getElementById('logoutBtn').style.display='inline-block';
  document.getElementById('logoutName').textContent = CURRENT_USER.name+' ('+CURRENT_USER.role+')';
  const m=document.getElementById('main');
  if(TAB==='dash') m.innerHTML = viewDash();
  if(TAB==='pos') m.innerHTML = viewPOS();
  if(TAB==='prod') m.innerHTML = viewProd();
  if(TAB==='sales') m.innerHTML = viewSales();
  if(TAB==='purch') m.innerHTML = viewPurch();
  if(TAB==='wh') m.innerHTML = viewWarehouses();
  if(TAB==='vouchers') m.innerHTML = viewVouchers();
  if(TAB==='assembly') m.innerHTML = viewAssembly();
  if(TAB==='exp') m.innerHTML = viewExp();
  if(TAB==='cust') m.innerHTML = viewCust();
  if(TAB==='sup') m.innerHTML = viewSup();
  if(TAB==='settings') m.innerHTML = viewSettings();
  attachHandlers();
}
function renderLogin(){
  document.getElementById('nav').innerHTML='';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('hStore').textContent='';
  document.getElementById('main').innerHTML=`
  <div class="card" style="max-width:360px;margin:40px auto">
    <h2>تسجيل الدخول</h2>
    <form class="inline" id="fLogin" style="grid-template-columns:1fr">
      <div><label>المستخدم</label><select name="uid">${DB.users.map(u=>`<option value="${u.id}">${u.name} (${u.role})</option>`).join('')}</select></div>
      <div><label>الرمز السري</label><input name="pin" type="password" inputmode="numeric"></div>
    </form>
    <button class="btn" id="loginBtn" style="width:100%">دخول</button>
    <div class="hint" id="loginErr" style="color:var(--bad)"></div>
  </div>`;
  document.getElementById('loginBtn').onclick=()=>{
    const f=document.getElementById('fLogin'); const d=Object.fromEntries(new FormData(f));
    const u=DB.users.find(x=>x.id===d.uid);
    if(u && String(u.pin)===String(d.pin)){
      CURRENT_USER=u; try{localStorage.setItem('mm_session',u.id);}catch(e){} render();
    } else { document.getElementById('loginErr').textContent='رمز سري غير صحيح'; }
  };
}

// ---------- DASHBOARD ----------
let dashFrom='', dashTo='';
function viewDash(){
  if(!dashFrom){ const d=new Date(); d.setMonth(d.getMonth()-1); dashFrom=d.toISOString().slice(0,10); dashTo=todayStr(); }
  const sales = DB.sales.filter(s=>inRange(s.date,dashFrom,dashTo));
  const lines = sales.map(salesLine);
  const totalSales = lines.reduce((a,l)=>a+l.total,0);
  const cogs = lines.reduce((a,l)=>a+l.cost,0);
  const gross = totalSales-cogs;
  const expenses = DB.expenses.filter(e=>inRange(e.date,dashFrom,dashTo)).reduce((a,e)=>a+(+e.amount||0),0);
  const net = gross-expenses;
  const byPay = {};
  PAYS.forEach(p=>byPay[p]=0);
  sales.forEach((s,i)=>byPay[s.pay]+=lines[i].total);
  const stockValue = DB.products.reduce((a,p)=>a+prodStats(p).stockValue,0);
  const lowStock = DB.products.filter(p=>['اطلب','نفد'].includes(prodStats(p).status)).length;
  const errs = DB.products.filter(p=>prodStats(p).status.startsWith('خطأ')).length;
  const custDebt = DB.customers.reduce((a,c)=>a+custBalance(c.name).balance,0);
  const supDebt = DB.suppliers.reduce((a,s)=>a+supBalance(s.name).balance,0);
  // top products by profit within range
  const profitByP = {};
  sales.forEach((s,i)=>{ profitByP[s.pid]=(profitByP[s.pid]||0)+lines[i].profit; });
  const top = Object.entries(profitByP).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([pid,val])=>({name:(DB.products.find(p=>p.id===pid)||{}).name||'—', val}));

  return `
  <div class="card">
    <h2>الفترة</h2>
    <div class="row">
      <div><label>من</label><input type="date" id="dFrom" value="${dashFrom}"></div>
      <div><label>إلى</label><input type="date" id="dTo" value="${dashTo}"></div>
      <div style="align-self:end"><button class="btn" id="dApply">تحديث</button></div>
    </div>
  </div>
  <div class="card">
    <h2>ملخص الفترة</h2>
    <div class="grid">
      <div class="stat"><div class="v">${fmt(totalSales)}</div><div class="l">إجمالي المبيعات</div></div>
      <div class="stat"><div class="v">${fmt(cogs)}</div><div class="l">تكلفة البضاعة</div></div>
      <div class="stat"><div class="v ${gross>=0?'ok':'bad'}">${fmt(gross)}</div><div class="l">مجمل الربح</div></div>
      <div class="stat"><div class="v">${fmt(expenses)}</div><div class="l">المصروفات</div></div>
      <div class="stat"><div class="v ${net>=0?'ok':'bad'}">${fmt(net)}</div><div class="l">صافي الربح</div></div>
      <div class="stat"><div class="v ${cashBalance()>=0?'ok':'bad'}">${fmt(cashBalance())}</div><div class="l">رصيد الصندوق (حتى اليوم)</div></div>
    </div>
  </div>
  <div class="card">
    <h2>طرق الدفع في الفترة</h2>
    <div class="grid">
      ${PAYS.map(p=>`<div class="stat"><div class="v">${fmt(byPay[p])}</div><div class="l">${p}</div></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h2>وضع المخزون والذمم (حتى اليوم)</h2>
    <div class="grid">
      <div class="stat"><div class="v">${fmt(stockValue)}</div><div class="l">قيمة المخزون</div></div>
      <div class="stat"><div class="v ${lowStock>0?'warn':'ok'}">${lowStock}</div><div class="l">أصناف تحتاج طلب/نفدت</div></div>

let POSCART=[];
let POS_SEARCH='';
function posAddLine(pid, qty){
  if(!pid) return;
  const existing = POSCART.find(l=>l.pid===pid);
  if(existing) existing.qty += qty; else POSCART.push({pid, qty});
}
function viewPOS(){
  const q=POS_SEARCH.trim().toLowerCase();
  const filtered = DB.products.filter(p=> !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q));
  const tiles = filtered.map(p=>{
    const st=prodStats(p);
    return `<button class="postile" data-tile="${p.id}" ${st.stock<=0?'disabled':''}>
      <div class="ptn">${p.name}</div>
      <div class="ptp">${fmt(p.price)}</div>
      <div class="pts">${fmt(st.stock)} ${p.unit}</div>
    </button>`;
  }).join('');
  const custOpts = DB.customers.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  const lines = POSCART.map((l,i)=>{
    const p = DB.products.find(x=>x.id===l.pid);
    const price = p?p.price:0;
    const total = price*l.qty;
    return `<tr><td>${p?p.code:'—'}</td><td>${p?p.name:'—'}</td>
      <td><input type="number" step="any" min="0.0001" value="${l.qty}" data-cart-qty="${i}" style="width:70px"></td>

      <td><button class="btn del" data-cart-del="${i}">إزالة</button></td></tr>`;

  return `
  <div class="card">

    <h2>السلة (${POSCART.length})</h2>

    <tbody>${lines||'<tr><td colspan="6">السلة فارغة — اضغط على صنف أعلاه لإضافته</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:10px;align-items:end;flex-wrap:wrap">

    const out=DB.products.find(p=>p.id===r.outPid);
    const comps = r.components.map(c=>{const p=DB.products.find(x=>x.id===c.pid);return (p?p.name:'—')+' × '+c.qty;}).join('، ');
    return `<tr><td>${out?out.name:'—'}</td><td>${comps}</td>
      <td><input type="number" step="any" min="0.0001" value="1" data-asm-qty="${r.id}" style="width:70px"></td>
      <td><button class="btn" data-asm-run="${r.id}">تنفيذ</button>
      <button class="btn del" data-del-asm="${r.id}">حذف</button></td></tr>`;
  }).join('');
  return `
  <div class="card">
    <h2>إنشاء وصفة تركيب جديدة</h2>
    <form class="inline" id="fAsmPart">
      <div><label>المكوّن</label><select name="pid">${prodOpts||'<option value="">أضف منتجاً أولاً</option>'}</select></div>
      <div><label>الكمية لكل وحدة ناتج</label><input name="qty" type="number" step="any" min="0.0001" value="1"></div>
      <div style="align-self:end"><button type="submit" class="btn">إضافة مكوّن</button></div>
    </form>
    <div class="tblwrap"><table><thead><tr><th>المكوّن</th><th>الكمية</th><th></th></tr></thead>
    <tbody>${partLines||'<tr><td colspan="3">أضف مكوّنات الوصفة</td></tr>'}</tbody></table></div>
    <form class="inline" id="fAsmSave" style="margin-top:10px">
      <div><label>المنتج الناتج</label><select name="outPid">${prodOpts||'<option value="">أضف منتجاً أولاً</option>'}</select></div>
      <div style="align-self:end"><button type="submit" class="btn" ${ASM_PARTS.length?'':'disabled'}>حفظ الوصفة</button></div>
    </form>
  </div>
  <div class="card">
    <h2>الوصفات المحفوظة (${DB.assemblies.length})</h2>
    <div class="tblwrap"><table><thead><tr><th>المنتج الناتج</th><th>المكوّنات</th><th>كمية الإنتاج</th><th></th></tr></thead>
    <tbody>${recRows || '<tr><td colspan="4">لا توجد وصفات بعد</td></tr>'}</tbody></table></div>
    <div class="hint">عند الضغط على «تنفيذ» يتم خصم المكوّنات من المخزون وإضافة الكمية المنتجة للمنتج الناتج تلقائياً.</div>
  </div>`;
}

// ---------- handlers ----------
function attachHandlers(){
  if(TAB==='dash'){
    document.getElementById('dApply').onclick=()=>{
      dashFrom=document.getElementById('dFrom').value; dashTo=document.getElementById('dTo').value; render();
    };
  }
  if(TAB==='pos'){
    const sInp=document.getElementById('posSearch');
    sInp.oninput=()=>{ POS_SEARCH=sInp.value; render();
      const el=document.getElementById('posSearch'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } };
    document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{ posAddLine(b.dataset.tile,1); render(); });
    document.querySelectorAll('[data-cart-qty]').forEach(inp=>inp.onchange=()=>{
      POSCART[+inp.dataset.cartQty].qty = +inp.value||0; });
    document.querySelectorAll('[data-cart-del]').forEach(b=>b.onclick=()=>{
      POSCART.splice(+b.dataset.cartDel,1); render(); });
    document.getElementById('posClear').onclick=()=>{ POSCART=[]; render(); };
    document.getElementById('posScanBtn').onclick=()=>startScan();
    const scClose=document.getElementById('scanClose'); if(scClose) scClose.onclick=()=>stopScan();
    const coBtn=document.getElementById('posCheckout');
    if(coBtn) coBtn.onclick=()=>{
      const pay=document.getElementById('posPay').value;
      const customer=document.getElementById('posCustomer').value;
      if(pay==='آجل' && !customer){ alert('اختر عميلاً للبيع الآجل'); return; }
      const inv='INV-'+(DB.sales.length+1);
      const date=todayStr();
      POSCART.forEach(l=>{
        const p=DB.products.find(x=>x.id===l.pid); if(!p||l.qty<=0) return;
        DB.sales.push({id:uid('s'),date,inv,pid:l.pid,qty:l.qty,price:p.price,disc:0,pay,customer:pay==='آجل'?customer:''});
      });
      POSCART=[]; save();
      if(confirm('تمت عملية البيع رقم '+inv+'. هل تريد طباعة الفاتورة؟')) printInvoice(inv);
      POS_SEARCH=''; render();
    };
  }
  if(TAB==='prod'){
    document.getElementById('saveProd').onclick=()=>{
      const f=document.getElementById('fProd'); const d=Object.fromEntries(new FormData(f));
      if(!d.code||!d.name){alert('الكود والاسم مطلوبان');return;}
      if(EDIT.prod){ const p=DB.products.find(x=>x.id===EDIT.prod); Object.assign(p,{code:d.code,barcode:d.barcode,name:d.name,cat:d.cat,unit:d.unit,open:+d.open,cost:+d.cost,price:+d.price,min:+d.min}); EDIT.prod=null; }
      else { DB.products.push({id:uid('p'),code:d.code,barcode:d.barcode,name:d.name,cat:d.cat,unit:d.unit,open:+d.open,cost:+d.cost,price:+d.price,min:+d.min}); }
      save(); render();
    };
    document.getElementById('cancelProd') && (document.getElementById('cancelProd').onclick=()=>{EDIT.prod=null;render();});
    document.querySelectorAll('[data-ed-prod]').forEach(b=>b.onclick=()=>{EDIT.prod=b.dataset.edProd;render();});
    document.querySelectorAll('[data-del-prod]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذا المنتج؟')){ DB.products=DB.products.filter(p=>p.id!==b.dataset.delProd); save(); render(); }
    });
    const sa=document.getElementById('saveAdj');
    if(sa) sa.onclick=()=>{
      const f=document.getElementById('fAdj'); const d=Object.fromEntries(new FormData(f));
      if(!d.pid||!(+d.qty)){alert('اختر منتجاً وأدخل فرقاً غير صفري');return;}
      DB.stockAdj.push({id:uid('adj'),date:d.date,pid:d.pid,qty:+d.qty,wh:d.wh,reason:d.reason,note:d.note});
      save(); render();
    };
    document.querySelectorAll('[data-del-adj]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذه التسوية؟')){ DB.stockAdj=DB.stockAdj.filter(x=>x.id!==b.dataset.delAdj); save(); render(); }
    });
  }
  if(TAB==='sales'){
    document.getElementById('saveSales').onclick=()=>{
      const f=document.getElementById('fSales'); const d=Object.fromEntries(new FormData(f));
      if(!d.pid){alert('اختر منتجاً');return;}
      const p=DB.products.find(x=>x.id===d.pid);
      const price = d.price===''? p.price : +d.price;
      const rec={date:d.date,inv:d.inv,pid:d.pid,qty:+d.qty,price,disc:+d.disc||0,pay:d.pay,customer:d.pay==='آجل'?d.customer:''};
      if(EDIT.sales){ Object.assign(DB.sales.find(x=>x.id===EDIT.sales),rec); EDIT.sales=null; }
      else { DB.sales.push({id:uid('s'),...rec}); }
      save(); render();
    };
    document.getElementById('cancelSales') && (document.getElementById('cancelSales').onclick=()=>{EDIT.sales=null;render();});
    document.querySelectorAll('[data-ed-sales]').forEach(b=>b.onclick=()=>{EDIT.sales=b.dataset.edSales;render();});
    document.querySelectorAll('[data-del-sales]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف عملية البيع هذه؟')){ DB.sales=DB.sales.filter(s=>s.id!==b.dataset.delSales); save(); render(); }
    });
    document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printInvoice(b.dataset.print));
  }
  if(TAB==='purch'){
    document.getElementById('savePurch').onclick=()=>{
      const f=document.getElementById('fPurch'); const d=Object.fromEntries(new FormData(f));
      if(!d.pid){alert('اختر منتجاً');return;}
      const p=DB.products.find(x=>x.id===d.pid);
      const unitCost = d.unitCost===''? p.cost : +d.unitCost;
      const rec={date:d.date,inv:d.inv,supplier:d.supplier,pid:d.pid,qty:+d.qty,unitCost,paid:+d.paid||0};
      if(EDIT.purch){ Object.assign(DB.purchases.find(x=>x.id===EDIT.purch),rec); EDIT.purch=null; }
      else { DB.purchases.push({id:uid('pu'),...rec}); }
      save(); render();
    };
    document.getElementById('cancelPurch') && (document.getElementById('cancelPurch').onclick=()=>{EDIT.purch=null;render();});
    document.querySelectorAll('[data-ed-purch]').forEach(b=>b.onclick=()=>{EDIT.purch=b.dataset.edPurch;render();});
    document.querySelectorAll('[data-del-purch]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف فاتورة الشراء هذه؟')){ DB.purchases=DB.purchases.filter(x=>x.id!==b.dataset.delPurch); save(); render(); }
    });
  }
  if(TAB==='wh'){
    document.getElementById('saveWh').onclick=()=>{
      const f=document.getElementById('fWh'); const d=Object.fromEntries(new FormData(f));
      if(!d.name){alert('أدخل اسم المخزن');return;}
      DB.warehouses.push({id:uid('wh'),name:d.name}); save(); render();
    };
    document.getElementById('saveTransfer').onclick=()=>{
      const f=document.getElementById('fTransfer'); const d=Object.fromEntries(new FormData(f));
      if(!d.pid||d.from===d.to||!(+d.qty>0)){alert('تأكد من اختيار منتج ومخزنين مختلفين وكمية صحيحة');return;}
      const fromName=DB.warehouses.find(w=>w.id===d.from).name, toName=DB.warehouses.find(w=>w.id===d.to).name;
      DB.stockAdj.push({id:uid('adj'),date:d.date,pid:d.pid,qty:-(+d.qty),wh:d.from,reason:'نقل مخزني',note:'نقل إلى '+toName});
      DB.stockAdj.push({id:uid('adj'),date:d.date,pid:d.pid,qty:+d.qty,wh:d.to,reason:'نقل مخزني',note:'نقل من '+fromName});
      save(); render();
    };
  }
  if(TAB==='vouchers'){
    document.getElementById('saveVoucher').onclick=()=>{
      const f=document.getElementById('fVoucher'); const d=Object.fromEntries(new FormData(f));
      if(!(+d.amount>0)){alert('أدخل مبلغاً صحيحاً');return;}
      DB.vouchers.push({id:uid('v'),date:d.date,type:d.type,party:d.party,amount:+d.amount,note:d.note});
      save(); render();
    };
    document.querySelectorAll('[data-del-v]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذا السند؟')){ DB.vouchers=DB.vouchers.filter(x=>x.id!==b.dataset.delV); save(); render(); }
    });
  }
  if(TAB==='assembly'){
    const fp=document.getElementById('fAsmPart');
    fp.onsubmit=(ev)=>{ ev.preventDefault(); const d=Object.fromEntries(new FormData(fp));
      if(!d.pid) return;
      const ex=ASM_PARTS.find(l=>l.pid===d.pid); if(ex) ex.qty=+d.qty; else ASM_PARTS.push({pid:d.pid,qty:+d.qty});
      render(); };
    document.querySelectorAll('[data-asm-del]').forEach(b=>b.onclick=()=>{ ASM_PARTS.splice(+b.dataset.asmDel,1); render(); });
    const fs=document.getElementById('fAsmSave');
    fs.onsubmit=(ev)=>{ ev.preventDefault(); const d=Object.fromEntries(new FormData(fs));
      if(!d.outPid||!ASM_PARTS.length){alert('اختر المنتج الناتج وأضف مكوّناً واحداً على الأقل');return;}
      DB.assemblies.push({id:uid('asm'),outPid:d.outPid,components:ASM_PARTS.slice()});
      ASM_PARTS=[]; save(); render(); };
    document.querySelectorAll('[data-del-asm]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذه الوصفة؟')){ DB.assemblies=DB.assemblies.filter(x=>x.id!==b.dataset.delAsm); save(); render(); }
    });
    document.querySelectorAll('[data-asm-run]').forEach(b=>b.onclick=()=>{
      const r=DB.assemblies.find(x=>x.id===b.dataset.asmRun);
      const qtyInput=document.querySelector(`[data-asm-qty="${r.id}"]`);
      const n=+qtyInput.value||0; if(n<=0){alert('أدخل كمية صحيحة');return;}
      const date=todayStr();
      r.components.forEach(c=>{
        DB.stockAdj.push({id:uid('adj'),date,pid:c.pid,qty:-(c.qty*n),reason:'تركيب - استهلاك',note:'تصنيع'});
      });
      DB.stockAdj.push({id:uid('adj'),date,pid:r.outPid,qty:n,reason:'تركيب - إنتاج',note:'تصنيع'});
      save(); render();
    });
  }
  if(TAB==='exp'){
    document.getElementById('saveExp').onclick=()=>{
      const f=document.getElementById('fExp'); const d=Object.fromEntries(new FormData(f));
      const rec={date:d.date,cat:d.cat,note:d.note,amount:+d.amount||0};
      if(EDIT.exp){ Object.assign(DB.expenses.find(x=>x.id===EDIT.exp),rec); EDIT.exp=null; }
      else { DB.expenses.push({id:uid('e'),...rec}); }
      save(); render();
    };
    document.getElementById('cancelExp') && (document.getElementById('cancelExp').onclick=()=>{EDIT.exp=null;render();});
    document.querySelectorAll('[data-ed-exp]').forEach(b=>b.onclick=()=>{EDIT.exp=b.dataset.edExp;render();});
    document.querySelectorAll('[data-del-exp]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذا المصروف؟')){ DB.expenses=DB.expenses.filter(x=>x.id!==b.dataset.delExp); save(); render(); }
    });
  }
  if(TAB==='cust'){
    document.getElementById('saveCust').onclick=()=>{
      const f=document.getElementById('fCust'); const d=Object.fromEntries(new FormData(f));
      if(!d.name){alert('الاسم مطلوب');return;}
      if(EDIT.cust){ Object.assign(DB.customers.find(x=>x.id===EDIT.cust),d); EDIT.cust=null; }
      else { DB.customers.push({id:uid('c'),...d}); }
      save(); render();
    };
    document.getElementById('cancelCust') && (document.getElementById('cancelCust').onclick=()=>{EDIT.cust=null;render();});
    document.querySelectorAll('[data-ed-cust]').forEach(b=>b.onclick=()=>{EDIT.cust=b.dataset.edCust;render();});
    document.querySelectorAll('[data-del-cust]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذا العميل؟')){ DB.customers=DB.customers.filter(x=>x.id!==b.dataset.delCust); save(); render(); }
    });
    const cp=document.getElementById('saveCustPay');
    if(cp) cp.onclick=()=>{
      const f=document.getElementById('fCustPay'); const d=Object.fromEntries(new FormData(f));
      if(!d.customer||!(+d.amount>0)){alert('اختر عميلاً وأدخل مبلغاً صحيحاً');return;}
      DB.custPay.push({id:uid('cp'),date:d.date,customer:d.customer,amount:+d.amount});
      save(); render();
    };
  }
  if(TAB==='sup'){
    document.getElementById('saveSup').onclick=()=>{
      const f=document.getElementById('fSup'); const d=Object.fromEntries(new FormData(f));
      if(!d.name){alert('الاسم مطلوب');return;}
      if(EDIT.sup){ Object.assign(DB.suppliers.find(x=>x.id===EDIT.sup),d); EDIT.sup=null; }
      else { DB.suppliers.push({id:uid('su'),...d}); }
      save(); render();
    };
    document.getElementById('cancelSup') && (document.getElementById('cancelSup').onclick=()=>{EDIT.sup=null;render();});
    document.querySelectorAll('[data-ed-sup]').forEach(b=>b.onclick=()=>{EDIT.sup=b.dataset.edSup;render();});
    document.querySelectorAll('[data-del-sup]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذا المورد؟')){ DB.suppliers=DB.suppliers.filter(x=>x.id!==b.dataset.delSup); save(); render(); }
    });
    const sp=document.getElementById('saveSupPay');
    if(sp) sp.onclick=()=>{
      const f=document.getElementById('fSupPay'); const d=Object.fromEntries(new FormData(f));
      if(!d.supplier||!(+d.amount>0)){alert('اختر مورداً وأدخل مبلغاً صحيحاً');return;}
      DB.supPay.push({id:uid('sp'),date:d.date,supplier:d.supplier,amount:+d.amount});
      save(); render();
    };
  }
  if(TAB==='settings'){
    document.getElementById('saveSettings').onclick=()=>{
      const f=document.getElementById('fSettings'); const d=Object.fromEntries(new FormData(f));
      DB.store.name=d.name; DB.store.currency=d.currency; save(); render();
    };
    document.getElementById('exportBtn').onclick=()=>{
      const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='mini-market-backup-'+todayStr()+'.json'; a.click();
    };
    document.getElementById('importFile').onchange=(ev)=>{
      const file=ev.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const parsed=JSON.parse(reader.result);
          if(!parsed.products || !parsed.sales){ alert('ملف غير صالح'); return; }
          if(confirm('سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. متابعة؟')){
            DB=parsed; if(!DB.custPay)DB.custPay=[]; if(!DB.supPay)DB.supPay=[]; if(!DB.stockAdj)DB.stockAdj=[];
            if(!DB.warehouses||!DB.warehouses.length)DB.warehouses=[{id:'wh-main',name:'المخزن الرئيسي'}];
            if(!DB.vouchers)DB.vouchers=[]; if(!DB.assemblies)DB.assemblies=[];
            if(!DB.users||!DB.users.length)DB.users=[{id:'u1',name:'المدير',role:'مدير',pin:'1234'}];
            save(); render();
          }
        }catch(e){ alert('تعذرت قراءة الملف'); }
      };
      reader.readAsText(file);
    };
    const su=document.getElementById('saveUser');
    if(su) su.onclick=()=>{
      const f=document.getElementById('fUser'); const d=Object.fromEntries(new FormData(f));
      if(!d.name||!d.pin){alert('الاسم والرمز السري مطلوبان');return;}
      if(EDIT.user){ Object.assign(DB.users.find(u=>u.id===EDIT.user),d); EDIT.user=null; }
      else { DB.users.push({id:uid('u'),...d}); }
      save(); render();
    };
    document.getElementById('cancelUser') && (document.getElementById('cancelUser').onclick=()=>{EDIT.user=null;render();});
    document.querySelectorAll('[data-ed-user]').forEach(b=>b.onclick=()=>{EDIT.user=b.dataset.edUser;render();});
    document.querySelectorAll('[data-del-user]').forEach(b=>b.onclick=()=>{
      if(confirm('حذف هذا المستخدم؟')){ DB.users=DB.users.filter(u=>u.id!==b.dataset.delUser); if(CURRENT_USER&&CURRENT_USER.id===b.dataset.delUser)CURRENT_USER=null; save(); render(); }
    });
  }
}

render();
</script>
</body>
</html>
